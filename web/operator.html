<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172c23">
  <title>Доступ оператора · Метеоархив</title>
  <link rel="stylesheet" href="/archive.css">
  <link rel="stylesheet" href="/operator.css">
  <script type="module" src="/archive-shell.js"></script>
  <script type="module" src="/operator.js"></script>
</head>
<body>
  <a class="skip-archive" href="#main">К форме входа</a>
  <aside class="side" data-archive-nav></aside>
  <main id="main" class="operator-main" tabindex="-1">
    <section class="stack" aria-labelledby="operator-title">
      <header>
        <div class="breadcrumb"><a href="/">Метеоархив</a><span aria-hidden="true">›</span><strong>Доступ оператора</strong></div>
        <h1 id="operator-title">Доступ оператора</h1>
        <p class="sub">Для работы с файлами и регистрации метеостанций</p>
      </header>
      <div class="card operator-card">
        <p role="status" id="operator-status">Проверяем сессию…</p>
        <p role="alert" id="operator-error" class="note warn" hidden></p>
        <form id="operator-login" method="post" action="/api/operator/login" hidden>
          <label for="operator-password">Пароль оператора</label>
          <input type="password" id="operator-password" name="password" autocomplete="current-password"
                 maxlength="1024" required>
          <div class="operator-actions">
            <button class="btn primary" type="submit">Войти</button>
            <a class="btn line" href="/">К наблюдениям</a>
          </div>
        </form>
        <div class="operator-actions" id="operator-session" hidden>
          <a class="btn primary" href="/files">Файлы и импорт</a>
          <button class="btn line" type="button" id="operator-logout">Выйти</button>
          <a class="btn line" href="/">К наблюдениям</a>
        </div>
      </div>
      <noscript><p class="note">Включите JavaScript для входа в Метеоархив.</p></noscript>
    </section>
  </main>
</body>
</html>
